<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Sober Bar Passport Card</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .card {
      width: 3.5in;
      height: 2in;
      border: 2px solid #111;
      border-radius: 8px;
      padding: 0.15in;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin-bottom: 0.5in;
      page-break-after: always;
    }
    .card:last-child { page-break-after: auto; }
    .brand { font-size: 14pt; font-weight: 900; letter-spacing: -0.02em; }
    .tagline { font-size: 7pt; color: #555; margin-top: 2px; }
    .details { font-size: 8pt; line-height: 1.35; }
    .footer {
      display: flex;
      justify-content: space-between;
      font-size: 6pt;
      color: #444;
    }
    .back {
      align-items: center;
      text-align: center;
    }
    .qr {
      width: 0.7in;
      height: 0.7in;
    }
    .qr img { width: 100%; height: 100%; }
    .print-note {
      margin-bottom: 20px;
      font-size: 10pt;
      color: #666;
      max-width: 3.5in;
      text-align: center;
    }
    @media print {
      body { padding: 0; }
      .print-note { display: none; }
      .card { margin-bottom: 0; }
    }
  </style>
</head>
<body>
  <div class="print-note">
    Print on cardstock at 100% scale and cut along the edges. The QR opens sipsoberbar.com.
  </div>

  <div class="card">
    <div>
      <div class="brand">SOBER BAR</div>
      <div class="tagline">SOBER BAR &amp; KITCHEN</div>
    </div>
    <div class="details">
      3062 Beach Blvd S<br>
      Gulfport, FL 33707<br>
      (813) 586-1660
    </div>
    <div class="footer">
      <span>sipsoberbar.com</span>
      <span>@sipsoberbar</span>
    </div>
  </div>

  <div class="card back">
    <div class="details">
      Sun–Thu 7am–10pm<br>
      Fri–Sat 7am–midnight
    </div>
    <div class="qr">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://www.sipsoberbar.com/" width="200" height="200" alt="Sober Bar homepage">
    </div>
    <div class="footer">
      <span>sipsoberbar.com</span>
      <span>(813) 586-1660</span>
    </div>
  </div>
</body>
</html>
